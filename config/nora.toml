# Config padrão da Nora. Vai para o GitHub, então NADA pessoal aqui.
# Para personalizar (seu nome, outra voz, outro modelo), crie config/local.toml
# só com as chaves que quer mudar. Ele é ignorado pelo Git e sobrepõe este arquivo.

[assistente]
nome = "Nora"
# Palavra que acorda o assistente (v0.1.0).
palavra_de_ativacao = "Nora"
# Como a voz deve falar o nome dela (só na fala; na tela continua o nome). Vazio = como se escreve.
pronuncia = ""
idioma = "pt-BR"

[usuario]
# Como o assistente chama você. Defina em config/local.toml.
nome = ""

[persona]
descricao = "Assistente pessoal prestativa, direta e bem-humorada."
# 0.0 = totalmente séria, 1.0 = piadista.
humor = 0.4
# 0.0 = bem informal, 1.0 = bem formal.
formalidade = 0.3
# Respostas curtas por padrão; detalha quando pedirem.
respostas_curtas = false

[ouvido]
# Transcrição de fala (STT). "whisper.cpp" roda como servidor separado (whisper-server).
motor = "whisper.cpp"
url = "http://127.0.0.1:8178"
idioma = "pt"

[voz]
# Motor de fala (TTS): "kokoro" (local, padrão), "piper" (local) ou "elevenlabs" (nuvem, pago).
motor = "kokoro"
# Voz de reserva, usada quando a principal falha (ex.: ElevenLabs sem internet). Vazio = nenhuma.
# Precisa do servidor dela rodando (o Kokoro: iniciar_voz_windows.ps1 -Voz kokoro).
reserva = "kokoro"

[voz.pronuncias]
# Palavras que a voz fala mal, reescritas só na fala (a tela mostra o texto original).
# Vale para qualquer motor de voz. Ex.: "amanhã" = "amanhãn"

[voz.kokoro]
# Kokoro-82M (pesos Apache-2.0), servido por "nora servidor-kokoro".
# Vozes pt-BR: pf_dora (feminina), pm_alex e pm_santa (masculinas).
url = "http://127.0.0.1:5001"
voz = "pf_dora"
velocidade = 1.0

[voz.piper]
# Servidor HTTP do Piper (GPL-3.0, roda separado). A pt_BR-faber-medium é masculina e deriva
# de uma base só para uso não comercial: uso pessoal, baixada à parte, nunca distribuída.
url = "http://127.0.0.1:5000"
voz = "pt_BR-faber-medium"

[voz.elevenlabs]
# Nuvem, paga por uso. Chave em ELEVENLABS_API_KEY (.env). O voz_id aparece na página da voz
# no ElevenLabs (Voices > ... > Copy voice ID). Coloque o seu em config/local.toml.
voz_id = ""
modelo = "eleven_flash_v2_5"

[voz.comfyui]
# Usa um fluxo seu do ComfyUI como voz. Exporte o fluxo em "Workflow > Export (API)" e escreva
# {{texto}} no lugar da frase, no nó de texto. O ComfyUI precisa estar aberto.
url = "http://127.0.0.1:8188"
fluxo = "config/voz_comfyui.json"
# Em vez de escrever {{texto}} no fluxo, diga qual nó e campo recebem a frase: "ID.campo"
# (ex.: "12.text"; o ID é o número do nó no JSON exportado). Vazio = usar {{texto}}.
campo = ""
# Tempo máximo esperando o ComfyUI gerar cada frase.
espera_s = 120.0

[modelos.local]
provedor = "ollama"
modelo = "qwen3.5:9b"
# Tempo sem uso até o modelo sair da VRAM.
keep_alive = "10m"
# Quanto o modelo improvisa: mais baixo = mais objetivo e previsível; mais alto = mais criativo.
temperatura = 0.6
# Modo "pensando" (raciocínio antes de responder). Desligado na conversa por voz:
# no teste da RX 9060 XT ele somou vários segundos de silêncio a uma resposta simples.
pensar = false

[modelos.nuvem]
provedor = "anthropic"
# Conversa rápida e tarefas pesadas (usados a partir da v0.3.0).
rapido = "claude-haiku-5-5"
pesado = "claude-sonnet-5-5"

[escuta]
# Modo mãos livres ("nora ouvir"): detecção de fala (Silero VAD) e palavra de ativação.
# Chance mínima (0 a 1) de um trecho ser voz para começar a ouvir.
limiar = 0.5
# Silêncio, em milissegundos, que encerra a sua fala. Menor = responde mais rápido, mas pode
# cortar pausas no meio da frase.
silencio_ms = 700
# Segundos depois de uma resposta em que dá para continuar sem dizer o nome dela.
janela_s = 8.0
# Pausar o microfone enquanto ela fala. Necessário com caixa de som (senão ela se ouve).
# Com fone Bluetooth, deixe false e mande a voz para a saída "Headset" do fone ([audio]
# alto_falante): assim o fone não fica trocando entre modo chamada e modo música.
pausar_microfone = true

[audio]
# Microfone e alto-falante: vazio = padrão do Windows; ou o número/nome que "nora audio" mostra.
microfone = ""
alto_falante = ""
# Prioridade da voz (Windows): true = enquanto a Nora fala, os outros programas (música,
# vídeo) ficam mais baixos e depois voltam; false = ela fala misturada com o resto.
prioridade = true
# Volume dos outros programas enquanto ela fala, de 0 (mudo) a 1 (sem mudança).
volume_outros = 0.2

[memoria]
# Memória entre conversas (v0.2.0), guardada em <dados>/memoria.db, só na sua máquina.
ativa = true
# Modelo do Ollama que transforma texto em vetor de significado (multilíngue, MIT).
# Baixe uma vez com: ollama pull bge-m3
modelo_embeddings = "bge-m3"
# Depois de cada resposta, extrair fatos novos sobre você (em segundo plano).
curadoria = true
# Quantos fatos parecidos com a pergunta ela lê antes de responder, e quão parecidos (0 a 1).
fatos_por_pergunta = 5
similaridade_minima = 0.45
# Toda pergunta e resposta também fica guardada inteira; antes de responder, ela lê os trechos
# de conversas antigas mais parecidos com a pergunta (0 = não usar).
trocas_por_pergunta = 3

[caminhos]
# Banco de memória, histórico e outros dados pessoais. Fora do Git.
dados = "data"
