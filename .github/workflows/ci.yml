name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # numpy e soundfile: os testes de áudio (laboratório de voz, conjunto de treino) rodam de
      # verdade; o resto do extra [voz] (microfone, onnxruntime) não é preciso nos testes.
      - run: pip install -e ".[dev,memoria]" numpy soundfile
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
      - run: nora --verificar
