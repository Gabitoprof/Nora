name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # numpy and soundfile: the audio tests (voice lab, training set) run for real; the rest of
      # the [voz] extra (microphone, onnxruntime) is not needed in the tests.
      - run: pip install -e ".[dev,memoria]" numpy soundfile "websockets>=13"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
      - run: nora --verificar

  # The package installed from a wheel, outside the checkout (Linux only, to save minutes).
  instalacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/testar_instalacao_limpa.py

  hud:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hud/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
