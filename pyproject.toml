[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ella"
dynamic = ["version"]
description = "Assistente de IA pessoal por voz, em tempo real e local primeiro."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Carlos Gabriel Moura Santiago" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ella = "ella.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ella.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
