[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nora"
dynamic = ["version"]
description = "Assistente de IA pessoal por voz, em tempo real e local primeiro."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
authors = [{ name = "Carlos Gabriel Moura Santiago" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Microfone e alto-falante (conversa por voz).
voz = [
    "sounddevice>=0.5",
    "numpy>=1.24",
    "onnxruntime>=1.16",
    # Ler áudios em FLAC/MP3/WAV 32 bits (ex.: o que o ComfyUI gera).
    "soundfile>=0.12",
    # Abaixar o som dos outros programas enquanto a Nora fala (Windows).
    "pycaw>=20240210; sys_platform == 'win32'",
]
# Voz local Kokoro (servidor separado; usa phonemizer/espeak-ng, GPL-3.0).
kokoro = ["kokoro-onnx>=0.4"]
# Cérebro na nuvem (v0.3.0): ChatGPT (OpenAI) e Claude (Anthropic) para as perguntas difíceis.
nuvem = ["anthropic>=1.0", "openai>=1.0"]
# Busca vetorial rápida da memória (sem ela, a busca é feita em Python puro, mais lenta).
memoria = ["sqlite-vec>=0.1.6"]
# Gerar o nora.exe (scripts/empacotar_windows.ps1). Só no build; não vai dentro do .exe.
empacotar = ["pyinstaller>=6.10"]

[project.scripts]
nora = "nora.cli:main"

[tool.setuptools.dynamic]
version = { attr = "nora.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nora = ["*.json", "*.html", "*.toml", "_commit.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
