[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nora"
dynamic = ["version"]
description = "Personal real-time voice AI assistant, local first."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
authors = [{ name = "Carlos Gabriel Moura Santiago" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Microphone and speaker (voice conversation).
voz = [
    "sounddevice>=0.5",
    "numpy>=1.24",
    "onnxruntime>=1.16",
    # Reading 32-bit FLAC/MP3/WAV audio (e.g. what ComfyUI generates).
    "soundfile>=0.12",
    # Lowering the volume of other programs while Nora speaks (Windows).
    "pycaw>=20240210; sys_platform == 'win32'",
    # ElevenLabs v4: real-time dialogue over WebSocket.
    "websockets>=13",
]
# Kokoro local voice (separate server; uses phonemizer/espeak-ng, GPL-3.0).
kokoro = ["kokoro-onnx>=0.4"]
# Cloud brain (v0.3.0): ChatGPT (OpenAI) and Claude (Anthropic) for the hard questions.
nuvem = ["anthropic>=1.0", "openai>=1.0"]
# Fast vector search for memory (without it, search runs in pure Python, more slowly).
memoria = ["sqlite-vec>=0.1.6"]
# Building nora.exe (scripts/empacotar_windows.ps1). Build-time only; not shipped inside the .exe.
empacotar = ["pyinstaller>=6.10"]

[project.scripts]
nora = "nora.cli:main"

[tool.setuptools.dynamic]
version = { attr = "nora.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nora = ["*.json", "*.html", "*.toml", "_commit.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
